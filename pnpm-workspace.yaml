overrides:
  brace-expansion: 5.0.12
  # Workbox uses the unchanged async glob API; retire its deprecated glob 11.
  "workbox-build>glob": 13.0.6
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
allowBuilds:
  sharp: true
  core-js: false
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - lucide-react@1.61.0
  - puppeteer-core@25.16.0
  - serialize-javascript@7.1.4
