<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">CloakResume</title>
  <desc id="description">A white portrait card with three equal index tabs sits on a green enamel disc.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#84d8ae"/>
      <stop offset=".47" stop-color="#26936a"/>
      <stop offset="1" stop-color="#126349"/>
    </linearGradient>
    <linearGradient id="rim" x1=".24" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/>
      <stop offset=".39" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#0a1540" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".24" cy=".16" r=".8">
      <stop stop-color="#fff" stop-opacity=".27"/>
      <stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="19.4" y1="14.7" x2="44.6" y2="50.1">
      <stop stop-color="#fff"/>
      <stop offset=".68" stop-color="#fff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <mask id="profile-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <circle cx="22" cy="27" r="3.3"/>
      <path d="M16.45 34.5q.75-4.1 5.55-4.1t5.55 4.1q-5.55 1.45-11.1 0Z"/>
      <path d="M32.5 27h12m-12 5.5h8.8m-23.8 7.3h27m-27 4.2h18.1" fill="none" stroke="black" stroke-width="2.15" stroke-linecap="round"/>
    </mask>
    <path id="index-tab" d="M0 5.5v-.7l1.12-3.55Q1.51 0 2.78 0h7.94q1.27 0 1.66 1.25L13.5 4.8v.7Z"/>
    <path id="card-body" mask="url(#profile-cut)" d="M9.5 19.95Q9.5 19 10.45 19h43.1q.95 0 .95 .95v28.7q0 1.45-1.45 1.45h-42.1q-1.45 0-1.45-1.45Z"/>
    <clipPath id="below-tabs">
      <rect x="0" y="19" width="64" height="45"/>
    </clipPath>
    <filter id="contact" x="-15%" y="-15%" width="135%" height="140%">
      <feGaussianBlur stdDeviation=".85"/>
    </filter>
    <style>
      @media (prefers-color-scheme: dark) {
        [stop-color="#84d8ae"] { stop-color: #5c987b }
        [stop-color="#26936a"] { stop-color: #26694f }
        [stop-color="#126349"] { stop-color: #154b3f }
      }
    </style>
  </defs>
  <g id="disc">
    <circle id="disc-base" cx="32" cy="32" r="30" fill="url(#enamel)"/>
    <circle id="disc-rim" cx="32" cy="32" r="29.5" fill="url(#bloom)" stroke="url(#rim)" stroke-width="1"/>
  </g>
  <g id="artwork">
    <g id="ground" transform="translate(5.12 5.12) scale(.84)">
      <g transform="rotate(-5 32 32)">
        <use href="#index-tab" x="40" y="14.2" fill="#b8c3c9"/>
      </g>
    </g>
    <g id="divider" transform="translate(5.12 5.12) scale(.84)">
      <g transform="rotate(-5 32 32)">
        <use href="#index-tab" x="25.25" y="14.2" fill="#d9dfe3"/>
      </g>
    </g>
    <g id="face" transform="translate(5.12 5.12) scale(.84)">
      <g transform="rotate(-5 32 32)">
        <use href="#index-tab" x="10.5" y="14.2" fill="#fff"/>
        <g clip-path="url(#below-tabs)">
          <use href="#card-body" transform="translate(.45 1.6)" fill="#104b37" opacity=".48" filter="url(#contact)"/>
          <use href="#card-body" transform="translate(.18 .68)" fill="#b6bec4" stroke="#b6bec4" stroke-width=".65"/>
          <use href="#card-body" fill="url(#paper)" stroke="#fff" stroke-width=".55" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
