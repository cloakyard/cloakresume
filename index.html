<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Defence in depth for the local-first architecture. The application has no
      résumé upload endpoint; this policy additionally limits connections and
      executable resources to the application origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'"
    />

    <!-- Favicons -->
    <link rel="icon" href="/cloakresume-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />

    <!-- Safari pinned tab -->
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#047857" />

    <!-- Preserve native browser zoom for accessibility on every screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme -->
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CloakResume" />

    <!-- SEO -->
    <meta
      name="description"
      content="Build, tailor, review, and export a serious résumé in one browser tab. CloakResume keeps résumé and job-description content on your device."
    />
    <meta
      name="keywords"
      content="resume builder, ats resume, private resume builder, local resume builder, free resume builder, resume pdf export, ats score, resume templates, cv builder"
    />
    <link rel="canonical" href="https://resume.cloakyard.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resume.cloakyard.com/" />
    <meta property="og:title" content="CloakResume — Your next chapter. In your words." />
    <meta
      property="og:description"
      content="Build, tailor, review, and export a serious résumé in one browser tab. Nothing uploaded."
    />
    <meta property="og:image" content="https://resume.cloakyard.com/icons/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CloakResume: Your next chapter. In your words. Air editor with a synthetic sample résumé."
    />
    <meta property="og:site_name" content="CloakResume" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloakResume — Your next chapter. In your words." />
    <meta
      name="twitter:description"
      content="Build, tailor, review, and export a serious résumé in one browser tab. Nothing uploaded."
    />
    <meta name="twitter:image" content="https://resume.cloakyard.com/icons/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="CloakResume: Your next chapter. In your words. Air editor with a synthetic sample résumé."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CloakResume",
        "url": "https://resume.cloakyard.com",
        "description": "Build, tailor, review and export your résumé in your browser. Your draft and job description stay on your device.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "17 Résumé Templates",
          "ATS Review and Keyword Matching",
          "Writing Review",
          "Customise Template Colour",
          "Reorder Sections",
          "Export to PDF",
          "Rich Text Editing",
          "Installable Progressive Web App",
          "No Account Required"
        ],
        "browserRequirements": "Requires a modern web browser with JavaScript enabled"
      }
    </script>

    <title>CloakResume — Your next chapter. In your words.</title>
  </head>
  <body>
    <noscript>
      <link rel="stylesheet" href="/src/styles/air.css" />
      <main class="air-page">
        <div class="air-page-frame air-page-intro">
          <h1>CloakResume needs JavaScript</h1>
          <p class="air-page-lede">
            Enable JavaScript to build and export a résumé in your browser. Your résumé content
            stays on your device.
          </p>
          <a class="air-button" href="https://cloakyard.com">Explore Cloakyard</a>
        </div>
      </main>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
